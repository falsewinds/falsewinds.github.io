function rayRect(x,y,dx,dy,r,max){let lo=0,hi=max;for(const [o,d,a,b] of [[x,dx,r.x,r.x+r.w],[y,dy,r.y,r.y+r.h]]){if(Math.abs(d)<1e-8){if(o<a||o>b)return max;}else{let t=(a-o)/d,z=(b-o)/d;if(t>z)[t,z]=[z,t];lo=Math.max(lo,t);hi=Math.min(hi,z);if(lo>hi)return max;}}return lo>0.01?lo:hi>0.01?0:max;}

const stick=$("stick");function joy(e){const b=stick.getBoundingClientRect(),x=e.clientX-b.left-b.width/2,y=e.clientY-b.top-b.height/2,r=b.width*.36,l=Math.hypot(x,y),d=l>r?r/l:1;input.jx=x*d/r;input.jy=y*d/r;if(Math.hypot(input.jx,input.jy)<.12)input.jx=input.jy=0;$("knob").style.transform=`translate(calc(-50% + ${x*d}px),calc(-50% + ${y*d}px))`;}
stick.addEventListener("pointerdown",e=>{if(!running||paused||player.dead)return;e.preventDefault();setTouch(true);input.jid=e.pointerId;stick.setPointerCapture(e.pointerId);joy(e);});stick.addEventListener("pointermove",e=>{if(input.jid===e.pointerId)joy(e);});function stopJoy(e){if(input.jid!==e.pointerId)return;input.jid=null;input.jx=input.jy=0;$("knob").style.transform="translate(-50%,-50%)";}stick.addEventListener("pointerup",stopJoy);stick.addEventListener("pointercancel",stopJoy);stick.addEventListener("lostpointercapture",stopJoy);
for(const [k,id] of [["w","ward"],["e","speed"],["r","ult"]]){const b=$(id);b.addEventListener("pointerdown",e=>{e.preventDefault();if(!running||paused||ended||player.dead)return;if(e.pointerType!=="mouse")setTouch(true);if(k==="e"){castPlayer(k);return;}b.setPointerCapture(e.pointerId);const box=b.getBoundingClientRect();input.aim={id:e.pointerId,key:k,start:{x:e.clientX,y:e.clientY},origin:{x:box.left+box.width/2,y:box.top+box.height/2},world:aimPoint(k)};b.classList.add("aim");});b.addEventListener("pointermove",e=>{const a=input.aim;if(!a||a.id!==e.pointerId)return;const dx=e.clientX-a.start.x,dy=e.clientY-a.start.y,l=Math.hypot(dx,dy);if(l>7){const d=norm(dx,dy),r=k==="w"?185:345,mag=clamp(l/70,.22,1);a.world={x:player.x+d.x*r*mag,y:player.y+d.y*r*mag};}});const release=(e,cancel)=>{const a=input.aim;if(!a||a.id!==e.pointerId)return;input.aim=null;b.classList.remove("aim");if(!cancel)castPlayer(k,a.world);};b.addEventListener("pointerup",e=>release(e,false));b.addEventListener("pointercancel",e=>release(e,true));b.addEventListener("lostpointercapture",e=>release(e,true));}
addEventListener("keydown",e=>{if(e.repeat)return;const k=e.key.toLowerCase();if(["w","e","r","escape"].includes(k))e.preventDefault();if(k==="escape"){togglePause();return;}if(["w","e","r"].includes(k))castPlayer(k);});
function togglePause(){if(!running||ended)return;paused=!paused;$("paused").classList.toggle("hide",!paused);input.jid=null;input.jx=input.jy=0;input.mouse.active=false;input.aim=null;$("knob").style.transform="translate(-50%,-50%)";document.querySelectorAll(".skill").forEach(b=>b.classList.remove("aim"));}
$("pause").onclick=togglePause;$("resume").onclick=togglePause;$("restart").onclick=init;$("retry").onclick=init;$("start").onclick=init;function showMenu(){running=false;ended=false;paused=false;$("menu").classList.remove("hide");$("paused").classList.add("hide");$("end").classList.add("hide");$("hud").classList.remove("on");cam={x:1400,y:1400};}$("exit").onclick=showMenu;$("choose").onclick=showMenu;
addEventListener("blur",()=>{if(running&&!paused&&!ended)togglePause();});document.addEventListener("visibilitychange",()=>{if(document.hidden&&running&&!paused&&!ended)togglePause();});
function setHero(n){selected=n;document.querySelectorAll(".hero-card").forEach((e,i)=>e.classList.toggle("selected",i===n));const h=HERO[n];$("detail").innerHTML=`<b>${h.name}・${h.role}</b>　生命 ${h.hp}／護甲 ${h.armor}／移速 ${h.move}<br><b>R ${h.r}</b>：${h.desc}　（${h.cd} 秒）<br><b>被動 ${h.pass}</b>：${h.ptext}`;}
HERO.forEach((h,i)=>{const b=document.createElement("button"),c=document.createElement("canvas"),t=document.createElement("div");b.className="hero-card";c.width=c.height=86;const cc=c.getContext("2d");ellipse(cc,43,43,37,37,"#dbc5a1","#ae9268",2);portrait(cc,43,43,29,h,0);t.innerHTML=`<b>${h.name}</b><small>${h.r}</small>`;b.append(c,t);b.onclick=()=>setHero(i);$("heroes").append(b);});setHero(0);document.querySelectorAll(".mode").forEach(b=>b.onclick=()=>{mode=b.dataset.mode;document.querySelectorAll(".mode").forEach(e=>e.classList.toggle("selected",e===b));});
let last=performance.now(),acc=0;function loop(now){const dt=clamp((now-last)/1000,0,.08);last=now;if(running&&!paused&&!ended){acc+=dt;let n=0;while(acc>=1/30&&n++<4){step(1/30);acc-=1/30;if(!running||ended)break;}}else acc=0;render();requestAnimationFrame(loop);}cam={x:1400,y:1400};drawTerrainOnce();requestAnimationFrame(loop);
</script>
